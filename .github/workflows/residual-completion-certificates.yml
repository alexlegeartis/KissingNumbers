name: Exact residual completion certificates
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy scipy sympy threadpoolctl
      - run: python verifications/improved/dim32-35-signed-layers/verify.py
      - run: python verifications/improved/dim32-35-signed-layers/root_trades/negative_controls.py
      - run: python verifications/improved/dim36-37-coxeter-todd/verify.py
      - run: python verifications/improved/dim36-37-coxeter-todd/completion/negative_controls.py
      - run: python verifications/improved/dim38-joint-latitudes/verify.py
      - run: python verifications/improved/dim38-joint-latitudes/refill/negative_controls.py
      - run: python audit.py --repository-only --write-results
      - run: git diff --exit-code -- RESULTS.md
      - run: python audit.py --repository-only
      - run: python verifications/improved/dim41-46-p48-heads/verify.py
      - run: python verifications/improved/dim41-46-p48-heads/continuation43/negative_controls.py
      - run: python verifications/improved/dim73-88-gamma72-cosets/verify_norm10.py
      - run: python verifications/improved/dim61-68-95-96-code-layers/verify95_96.py
      - run: python verifications/improved/dim61-68-95-96-code-layers/verify_significant.py --cpp
      - run: python verifications/improved/dim61-68-95-96-code-layers/verify_shared.py --full-codes
      - run: python verifications/improved/dim64-65-signed-parity/verify.py
      - run: python verifications/improved/dim61-68-95-96-code-layers/search/negative_controls.py
      - run: python verifications/improved/dim26-31-residual-completions/verify.py
